networks:
  fb_farol_net:
    name: a0wcggw4wo040gwwwokckgk8_fb_net
    external: true

services:
  cerebro-jc-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090"
    networks:
      - default
      - fb_farol_net
    labels:
      # O Coolify gera os routers (Host/PathPrefix) automaticamente a
      # partir do domínio configurado na UI, mas NÃO gerou o label de
      # serviço/porta pra este deploy (docker-compose) — sem ele o
      # Traefik aceita a conexão e trava, nunca chega no backend
      # (achado 16/09/2026, depois de indisponibilidade real neste
      # domínio). Fixado explicitamente aqui pra não depender de
      # detecção automática do Coolify/Traefik.
      - "traefik.http.services.cerebro-jc-api.loadbalancer.server.port=8090"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - API_TOKEN=${API_TOKEN}
      - PORT=8090
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - FAROL_BASE_URL=${FAROL_BASE_URL}
      - FAROL_GATEWAY_TOKEN=${FAROL_GATEWAY_TOKEN}
    restart: unless-stopped
