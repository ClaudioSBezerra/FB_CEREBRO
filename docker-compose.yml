networks:
  fb_farol_net:
    name: a0wcggw4wo040gwwwokckgk8_fb_net
    external: true

services:
  cerebro-jc-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090"
    networks:
      - default
      - fb_farol_net
    labels:
      # O Coolify gera os routers (Host/PathPrefix) automaticamente a
      # partir do domínio configurado na UI, mas NÃO gerou o label de
      # serviço/porta pra este deploy (docker-compose) — sem ele o
      # Traefik aceita a conexão e trava, nunca chega no backend
      # (achado 16/09/2026, depois de indisponibilidade real neste
      # domínio). Fixado explicitamente aqui pra não depender de
      # detecção automática do Coolify/Traefik.
      - "traefik.http.services.cerebro-jc-api.loadbalancer.server.port=8090"
      - "traefik.http.routers.http-0-uksccs8844cc4cccgk8kw00o-cerebro-jc-api.service=cerebro-jc-api"
      - "traefik.http.routers.https-0-uksccs8844cc4cccgk8kw00o-cerebro-jc-api.service=cerebro-jc-api"
      # Container em 3 redes (default do compose + fb_farol_net) — sem
      # dizer qual delas o Traefik deve usar pra alcançar o container,
      # ele pode escolher a errada (ex.: a fb_farol_net, que o
      # coolify-proxy não integra) e travar a conexão silenciosamente.
      - "traefik.docker.network=uksccs8844cc4cccgk8kw00o"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - API_TOKEN=${API_TOKEN}
      - PORT=8090
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - FAROL_BASE_URL=${FAROL_BASE_URL}
      - FAROL_GATEWAY_TOKEN=${FAROL_GATEWAY_TOKEN}
      - EMAILS_PERMITIDOS=${EMAILS_PERMITIDOS}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - SMARTPICK_BASE_URL=${SMARTPICK_BASE_URL}
      - SMARTPICK_GATEWAY_TOKEN=${SMARTPICK_GATEWAY_TOKEN}
    restart: unless-stopped
