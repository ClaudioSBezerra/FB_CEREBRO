services:
  cerebro-jc-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - API_TOKEN=${API_TOKEN}
      - PORT=8090
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - FAROL_BASE_URL=${FAROL_BASE_URL}
      - FAROL_GATEWAY_TOKEN=${FAROL_GATEWAY_TOKEN}
    restart: unless-stopped
