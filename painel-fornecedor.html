<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faturado por Fornecedor — JC Distribuição</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --border:    #21262d;
    --text:      #e6edf3;
    --muted:     #7d8590;
    --accent:    #1f6feb;
    --green:     #3fb950;
    --yellow:    #d29922;
    --orange:    #e3710a;
    --red:       #f85149;
    --total-bg:  #1c2128;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 13px;
  }

  /* ── Header ── */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 20px 32px 16px;
    display: flex;
    align-items: baseline;
    gap: 24px;
    flex-wrap: wrap;
  }
  .brand {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .header-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
  }
  .period-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .period-badge strong { color: var(--text); font-weight: 500; }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--border); }
  .ts {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    padding: 3px 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  /* ── Summary cards ── */
  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .card {
    background: var(--surface);
    padding: 18px 24px;
  }
  .card-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .card-value {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .card-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ── Chart ── */
  .chart-section {
    padding: 24px 32px 8px;
  }
  .chart-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }
  .chart-subtitle {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .bar-row {
    margin-bottom: 14px;
  }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12.5px;
    margin-bottom: 4px;
    gap: 12px;
  }
  .bar-name {
    color: var(--text);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-value {
    display: flex;
    align-items: baseline;
    gap: 8px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .bar-track {
    position: relative;
    height: 10px;
    background: var(--surface);
    border-radius: 3px;
    overflow: visible;
  }
  .bar-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    border-radius: 3px;
    background: var(--accent);
  }
  .bar-fill.g100 { background: var(--green); }
  .bar-fill.g80  { background: var(--yellow); }
  .bar-fill.g70  { background: var(--orange); }
  .bar-fill.low  { background: var(--red); }
  .bar-marker {
    position: absolute;
    top: -3px;
    width: 2px;
    height: 16px;
    background: var(--muted);
    border-radius: 1px;
  }
  .chart-legend {
    display: flex;
    gap: 18px;
    font-size: 11px;
    color: var(--muted);
    margin: 16px 0 4px;
  }
  .chart-legend span { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; background: var(--accent); }
  .legend-marker { width: 2px; height: 10px; background: var(--muted); }

  /* ── Search ── */
  .search-wrap {
    padding: 20px 32px 0;
  }
  .search-input {
    width: 100%;
    max-width: 320px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    padding: 8px 12px;
    border-radius: 5px;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  /* ── Table ── */
  .table-wrap {
    overflow-x: auto;
    padding-top: 12px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }

  thead th {
    background: var(--surface);
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .07em;
    padding: 10px 12px;
    text-align: right;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 1;
  }
  thead th:first-child { text-align: left; min-width: 220px; padding-left: 32px; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  tbody tr:hover { background: rgba(31,111,235,.05); }
  tbody tr.total-row {
    background: var(--total-bg);
    border-top: 2px solid var(--border);
    border-bottom: 2px solid var(--border);
  }
  tbody tr.total-row td { font-weight: 600; }

  td {
    padding: 9px 12px;
    text-align: right;
    white-space: nowrap;
    color: var(--text);
  }
  td:first-child {
    text-align: left;
    padding-left: 32px;
    color: var(--text);
    font-weight: 500;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .pct {
    display: inline-flex;
    align-items: center;
    justify-content: flex-end;
    font-weight: 600;
    font-size: 12px;
    min-width: 44px;
  }
  .pct.g100 { color: var(--green); }
  .pct.g80  { color: var(--yellow); }
  .pct.g70  { color: var(--orange); }
  .pct.low  { color: var(--red); }

  .num { color: var(--muted); font-size: 12px; }

  /* ── States ── */
  .state {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 200px;
    color: var(--muted);
    font-size: 13px;
    gap: 10px;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error { color: var(--red); }
</style>
</head>
<body>

<div class="header">
  <span class="brand">JC Distribuição</span>
  <span class="header-title">Faturado por Fornecedor</span>
  <div class="period-badge">
    <strong>ANO × ANO</strong>
    <div class="dot"></div>
    <span id="period-label">—</span>
    <div class="dot"></div>
    <span class="ts" id="ts">—</span>
  </div>
</div>

<div class="cards" id="cards"></div>

<div id="state" class="state">
  <div class="spinner"></div>
  <span>Buscando dados...</span>
</div>

<div id="conteudo" style="display:none">
  <div class="chart-section">
    <div class="chart-title">Top 20 fornecedores — venda atual</div>
    <div class="chart-subtitle" id="chart-subtitle">—</div>
    <div id="chart"></div>
    <div class="chart-legend">
      <span><span class="legend-swatch"></span> Venda no ano atual (cor = crescimento)</span>
      <span><span class="legend-marker"></span> Venda no ano anterior (mesmo recorte)</span>
    </div>
  </div>

  <div class="search-wrap">
    <input class="search-input" id="busca" type="text" placeholder="Buscar fornecedor...">
  </div>

  <div class="table-wrap">
    <table id="tbl">
      <thead>
        <tr>
          <th>FORNECEDOR</th>
          <th id="th-venda-ant">—</th>
          <th id="th-venda-atu">—</th>
          <th>%</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const API   = 'https://cerebro-jc-api.fbtechia.com/faturado-fornecedor';
const TOKEN = '86e5b497c639a2bfd65a0467882dd3e02c472c31459e6d784c4acbe105ff1600';

// ── Formatadores ────────────────────────────────────────────────
const brl = v => 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const brlM = v => {
  const n = Number(v);
  if (n >= 1e9) return 'R$ ' + (n/1e9).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' Bi';
  if (n >= 1e6) return 'R$ ' + (n/1e6).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' Mi';
  return brl(v);
};
const pctClass = p => p >= 100 ? 'g100' : p >= 80 ? 'g80' : p >= 70 ? 'g70' : 'low';

function pctHtml(v) {
  return `<span class="pct ${pctClass(v)}">${v}%</span>`;
}

// ── Cards de resumo ─────────────────────────────────────────────
function renderCards(total, ano_anterior, ano_atual) {
  const el = document.getElementById('cards');
  const cresceu = total.venda_atual - total.venda_anterior;
  el.innerHTML = [
    { label: `Venda ${ano_anterior}`, value: brlM(total.venda_anterior), sub: 'Mesmo período, ano anterior' },
    { label: `Venda ${ano_atual}`,    value: brlM(total.venda_atual),    sub: `${total.pct_venda}% do ano anterior` },
    { label: 'Variação',              value: `${cresceu >= 0 ? '+' : ''}${brlM(cresceu)}`, sub: cresceu >= 0 ? 'Acima do ano anterior' : 'Abaixo do ano anterior' },
  ].map(c => `
    <div class="card">
      <div class="card-label">${c.label}</div>
      <div class="card-value">${c.value}</div>
      <div class="card-sub">${c.sub}</div>
    </div>
  `).join('');
}

// ── Gráfico (barras horizontais, escala comum) ───────────────────
function renderChart(fornecedores, anoAnterior) {
  const top = [...fornecedores]
    .sort((a, b) => b.venda_atual - a.venda_atual)
    .slice(0, 20);

  const maior = top.reduce((m, f) => Math.max(m, f.venda_atual, f.venda_anterior), 0);

  document.getElementById('chart-subtitle').textContent =
    `Traço cinza marca a venda de ${anoAnterior} na mesma escala — barra à direita do traço é crescimento, à esquerda é queda.`;

  document.getElementById('chart').innerHTML = top.map(f => {
    const largura = maior > 0 ? (f.venda_atual / maior * 100) : 0;
    const marcador = maior > 0 ? (f.venda_anterior / maior * 100) : 0;
    return `
    <div class="bar-row">
      <div class="bar-label">
        <span class="bar-name">${f.nome_fornec}</span>
        <span class="bar-value">${brlM(f.venda_atual)} ${pctHtml(f.pct_venda)}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill ${pctClass(f.pct_venda)}" style="width:${largura}%"></div>
        <div class="bar-marker" style="left:calc(${marcador}% - 1px)" title="${anoAnterior}: ${brl(f.venda_anterior)}"></div>
      </div>
    </div>`;
  }).join('');
}

// ── Linha da tabela ─────────────────────────────────────────────
function rowHtml(f, isTotals) {
  const cls = isTotals ? ' class="total-row"' : '';
  const nome = isTotals ? 'TOTAL GERAL' : `<span class="num" style="margin-right:6px;font-size:11px">${f.cod_fornec}</span>${f.nome_fornec}`;
  return `<tr${cls} data-nome="${(f.nome_fornec || '').toLowerCase()}">
    <td>${nome}</td>
    <td>${brl(f.venda_anterior)}</td>
    <td>${brl(f.venda_atual)}</td>
    <td>${pctHtml(f.pct_venda)}</td>
  </tr>`;
}

// ── Busca (filtro client-side, não refaz fetch) ──────────────────
document.getElementById('busca').addEventListener('input', (e) => {
  const termo = e.target.value.toLowerCase();
  document.querySelectorAll('#tbody tr:not(.total-row)').forEach(tr => {
    tr.style.display = tr.dataset.nome.includes(termo) ? '' : 'none';
  });
});

// ── Fetch e render ──────────────────────────────────────────────
async function load() {
  document.getElementById('ts').textContent =
    new Date().toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

  try {
    const res = await fetch(`${API}?all=true`, {
      headers: { Authorization: `Bearer ${TOKEN}` }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    // Rótulo do período: dinâmico, refletindo o que a API de fato
    // comparou (mesmo dia-do-ano nos dois anos) — antes era texto fixo
    // no HTML ("2025 (365 dias) vs 2026 (247 dias)") que nunca batia
    // com o dado real (achado 17/09/2026).
    const hoje = new Date();
    const inicioAno = new Date(hoje.getFullYear(), 0, 1);
    const diasDecorridos = Math.floor((hoje - inicioAno) / 86400000) + 1;
    document.getElementById('period-label').textContent =
      `${data.ano_anterior} (${diasDecorridos} dias) vs ${data.ano_atual} (${diasDecorridos} dias) — mesmo dia do ano`;
    document.getElementById('th-venda-ant').textContent = data.ano_anterior;
    document.getElementById('th-venda-atu').textContent = data.ano_atual;

    renderCards(data.total, data.ano_anterior, data.ano_atual);
    renderChart(data.fornecedores || [], data.ano_anterior);

    const tbody = document.getElementById('tbody');
    tbody.innerHTML =
      rowHtml(data.total, true) +
      (data.fornecedores || []).map(f => rowHtml(f, false)).join('');

    document.getElementById('state').style.display = 'none';
    document.getElementById('conteudo').style.display = '';

  } catch(e) {
    const s = document.getElementById('state');
    s.innerHTML = `<span class="error">Erro ao carregar dados: ${e.message}</span>`;
  }
}

load();
</script>
</body>
</html>
